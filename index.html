<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UnStevened</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">UnStevened</a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search games..." autocomplete="off">
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Game Library</h1>
      <p id="gameCount">Loading games...</p>
    </section>

    <section id="gameGrid" class="game-grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>No games match your search.</div>
    <div id="loadError" class="empty error" hidden>Could not load the game registry.</div>
  </main>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
